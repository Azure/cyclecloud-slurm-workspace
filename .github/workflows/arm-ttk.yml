name : arm-ttk
on:
  push:
    tags:
      - '*'
  pull_request:
    branches:
      - main
    paths:
      - 'bicep/**'
      - 'uidefinitions/**'
      - '.github/**'
      - 'build.sh'
      - 'util/**'
      - 'tests/**'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  arm_validation:
    runs-on: ubuntu-latest
    if: github.repository == 'Azure/cyclecloud-slurm-workspace' 
    permissions:
      contents: read    

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup arm-ttk
        id: setup
        run: |
          set -e
          ./util/install-arm-ttk.sh

      - name: Build ARM
        id: build
        env: 
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -e
          ./build.sh "$BRANCH"
